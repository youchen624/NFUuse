    <!doctype html>
    <html lang="zh-Hant">
    <head>
      <meta charset="utf-8">
      <title>[範例3-4] 依縣市篩選資料</title>
      <style>
        body { font-family: Arial, "Microsoft JhengHei", sans-serif; margin: 24px; line-height: 1.6; }
        h1 { color: #0b3b70; margin-bottom: 8px; }
        .note { color: #4b5563; margin-bottom: 16px; }
        table { border-collapse: collapse; min-width: 720px; margin-top: 12px; }
        th, td { border: 1px solid #cbd5e1; padding: 8px 10px; text-align: left; }
        th { background: #0f766e; color: white; }
        .high { background: #fff7ed; color: #9a3412; font-weight: bold; }
        .error { color: #991b1b; font-weight: bold; }
        .summary { background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px; margin: 12px 0; }
        pre { background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px; overflow: auto; }
      </style>
    </head>
    <body>
      <h1>[範例3-4] 依縣市篩選資料</h1>
      <p class="note">本範例使用 fetch() 載入遠端 JSON 檔，並加上時間戳與 cache: no-store，避免重新整理時讀到舊快取。</p>
      <div class="summary">篩選縣市：<span id="county"></span></div><table><thead><tr><th>測站</th><th>縣市</th><th>PM2.5</th></tr></thead><tbody id="result"></tbody></table>
      <script>
            async function main() {
          const url = "http://140.130.35.72/ppt/web/json/json3/" +
            "json3-4.json";
          const data = await fetch(
            url + "?t=" + Date.now(),
            { cache: "no-store" }
          )
            .then(r => r.json());
          document.querySelector("#county").textContent = data.county;
          const rows = data.records.filter(item =>
            item.county === data.county
          );
          document.querySelector("#result").innerHTML =
            rows.map(item =>
              `<tr><td>${item.siteName}</td>
              <td>${item.county}</td>
              <td>${item.pm25}</td></tr>`
            ).join("");
        }
        main();
      </script>
    </body>
    </html>
