<!DOCTYPE html>
<html>
<head>
    <title>dom-5.html</title>
</head>
<body>
    <script type="text/javascript">
        fetch('book3.xml')
            .then(response => response.text())
            .then(str => (new window.DOMParser()).parseFromString(str, "text/xml"))
            .then(xmlDom => {
                let xnodeList = xmlDom.getElementsByTagName("book")[0].childNodes;
                let xnode = xmlDom.getElementsByTagName("book")[0].firstChild;
                for (let i = 0; i < xnodeList.length; i++) {
                    if (xnode.nodeType == 1) {//Process only element nodes (type 1)
                        document.write(xnode.tagName + " : " + xnode.textContent + "<br />");
                    }
                    xnode = xnode.nextSibling;
                }
            })
            .catch(error => console.error('Error loading XML:', error));
    </script>
</body>
</html>
