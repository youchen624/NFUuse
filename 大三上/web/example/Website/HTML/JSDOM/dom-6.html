<!DOCTYPE html>
<html>
<head>
    <title>dom-6.html</title>
</head>
<body>
    <script type="text/javascript">
        fetch('book1.xml')
            .then(response => response.text())
            .then(str => (new window.DOMParser()).parseFromString(str, "text/xml"))
            .then(xmlDom => {
                document.write(xmlDom.getElementsByTagName("title")[0].textContent + "<br />");
                document.write(xmlDom.getElementsByTagName("title")[0].getAttribute("lang"));
            })
            .catch(error => console.error('Error loading XML:', error));
    </script>
</body>
</html>
