<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>

    <style>
        table {
            background-color: yellow;
            width: 360px;
        }

        .vt {
            background-color: red;
            writing-mode: vertical-lr;
            /* font-size: 18px; */
        }

        .pink {
            background-color: pink;
        }
    </style>
</head>
<body>
    <table border="2">
        <tr>
            <th rowspan="4" class="vt">資料分析</th>
            <th rowspan="2">數字</th>
            <th colspan="6" class="pink">編號</th>
        </tr>
        <tr>
            <th>1</th>
            <th>2</th>
            <th>3</th>
            <th>4</th>
            <th>5</th>
            <th>6</th>
        </tr>
        <tr>
            <th rowspan="2">文字</th>
            <th colspan="3">填表人</th>
            <th colspan="3">見證人</th>
        </tr>
        <tr>
            <th colspan="3">吳佩暾</th>
            <th colspan="3">楊偉崙</th>
        </tr>
    </table>
</body>
</html>
