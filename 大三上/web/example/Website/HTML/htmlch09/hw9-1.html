<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>伊蔻的首頁</title>
  <meta charset="utf-8" />

  <style>
    h2 {
      color: red;
    }

    span {
      color: blue;
    }

    .green {
      color: green;
    }
  </style>
</head>

<body>
  <h2>伊蔻的首頁</h2>
  <hr>
  <div class="green">
    <span>[伊蔻的基本資料] </span><br />
    有關伊蔻個人的<INS>基本資料</INS>，如<SUB>姓名、年齡、性別.....</SUB>。<br />
    <span>[伊蔻的日記告白]</span><br />
    日記是<INS>生命歲月</INS>的縮影，使用網頁來記錄也不錯。 <br />
    <span>[伊蔻的行曩背包]</span><br />
    列出整年中<INS>重要的日子</INS>，以提醒自己注意。<br />
    <span>[伊蔻的狐群狗黨]</span><br />
    獨學而無友，在家靠父母，<DEL>在外靠朋友</DEL>。<br />
    <span>[伊蔻的郵件信箱]</span><br />
    雖然在茫茫網海中你我並不相識，但<DEL>相逢自是有緣</DEL>。 <br />
    <span>[飛向浩瀚的天空]</span><br />
    開拓您的無限視野--網站<DEL>超鏈結</DEL>。
  </div>
</body>

</html>
