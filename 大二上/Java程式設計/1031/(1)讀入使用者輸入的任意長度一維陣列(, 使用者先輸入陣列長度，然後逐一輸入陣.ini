(1)讀入使用者輸入的任意長度一維陣列(, 使用者先輸入陣列長度，然後逐一輸入陣列內容)，程式可以輸出 selection sort 排序前後陣列的內容

(2)讀入使用者輸入的任意長度一維陣列(, 使用者先輸入陣列長度，然後逐一輸入陣列內容)，程式將陣列每一元素置換為出現在它之後的最大值(, 陣列最後一個元素直接替換為-1), 並將此陣列印出

(3a)建立一個下三角形二維陣列，高度 n 由使用者輸入，其中 0<n<=20，寫一程式將此三角形以'*'符號顯示在銀幕。
(3b)將數字 1, 2, 3, .... 依照由上到下，由左到右的順序填入一個下三角形矩陣(與(a)的三角形無關)，使用者可以輸入一個特定數 num<100000 ，寫一程式找到此數字出現在此下三角形的位置，印出此數字與此位置的列編號和行編號，但不用印出三角形內容。



